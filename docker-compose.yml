version: "3.8"
services:
  app-php-cms:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: integral_laravel_admin
    restart: always
    working_dir: /var/www
    volumes:
      - storage_data:/var/www/storage
      - app_public:/var/www/public
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - dokploy-network
  web:
    image: nginx:alpine
    container_name: integral_nginx_admin
    restart: always
    expose:
      - "80"
    volumes:
      - app_public:/var/www/public:ro
      - ./docker/nginx/prod.conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-php-cms
    networks:
      - dokploy-network
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.integral-backend-d9aohr-42-web.rule=Host(`integralbackend.webinfo.sv`)
      - traefik.http.routers.integral-backend-d9aohr-42-web.entrypoints=web
      - traefik.http.services.integral-backend-d9aohr-42-web.loadbalancer.server.port=80
      - traefik.http.routers.integral-backend-d9aohr-42-web.service=integral-backend-d9aohr-42-web
      - traefik.http.routers.integral-backend-d9aohr-42-web.middlewares=redirect-to-https@file
      - traefik.http.routers.integral-backend-d9aohr-42-websecure.rule=Host(`integralbackend.webinfo.sv`)
      - traefik.http.routers.integral-backend-d9aohr-42-websecure.entrypoints=websecure
      - traefik.http.services.integral-backend-d9aohr-42-websecure.loadbalancer.server.port=80
      - traefik.http.routers.integral-backend-d9aohr-42-websecure.service=integral-backend-d9aohr-42-websecure
      - traefik.http.routers.integral-backend-d9aohr-42-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
networks:
  dokploy-network:
    external: true
volumes:
  storage_data: null
  app_public: null