version: "3.8"

services:
  # Aplicación Laravel (PHP FPM)
  app-php-cms:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: integral_laravel_admin
    restart: always
    working_dir: /var/www
    volumes:
      # En producción solo persistimos storage para uploads/logs
      - storage_data:/var/www/storage
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - dokploy-network

  # Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: integral_nginx_admin
    restart: always
    expose:
      - "80"
    volumes:
      - ./docker/nginx/prod.conf/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-php-cms
    networks:
      - dokploy-network

networks:
  dokploy-network:
    driver: bridge

volumes:
  storage_data: